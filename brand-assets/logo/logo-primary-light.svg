<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 200" width="780" height="200" role="img" aria-label="My DTM Paris — Agence digitale">
  <defs>
    <linearGradient id="gradL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00b3c4"/>
      <stop offset="0.5" stop-color="#4d71ee"/>
      <stop offset="1" stop-color="#c400c9"/>
    </linearGradient>
    <linearGradient id="barsL" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4ce7f3"/>
      <stop offset="1" stop-color="#ff00d6"/>
    </linearGradient>
    <linearGradient id="cursorL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff00d6"/>
      <stop offset="1" stop-color="#9c00e2"/>
    </linearGradient>
  </defs>

  <!-- Badge symbole (reste sombre : contraste sur fond clair) -->
  <g transform="translate(20 20) scale(0.8)">
    <rect x="0" y="0" width="200" height="200" rx="46" fill="#12091f"/>
    <g transform="translate(56 60)" fill="url(#barsL)">
      <rect x="0"  y="40" width="16" height="40" rx="4"/>
      <rect x="24" y="12" width="16" height="68" rx="4"/>
      <rect x="48" y="12" width="16" height="68" rx="4"/>
      <rect x="72" y="40" width="16" height="40" rx="4"/>
    </g>
    <circle cx="144" cy="64" r="9" fill="#29f5eb"/>
  </g>

  <!-- Wordmark : My — DTM Paris (encre sombre) -->
  <g font-family="'Poppins','Segoe UI',sans-serif">
    <text x="208" y="118" font-size="64" font-weight="700" letter-spacing="-1" fill="#17123a">My</text>
    <rect x="315" y="86" width="36" height="14" rx="7" fill="url(#cursorL)"/>
    <text x="366" y="118" font-size="64" font-weight="700" letter-spacing="0" fill="url(#gradL)">DTM</text>
    <text x="548" y="118" font-size="64" font-weight="500" letter-spacing="0" fill="#6b2c94">Paris</text>
    <rect x="704" y="98" width="16" height="20" rx="3" fill="#c400c9"/>
  </g>
  <text x="210" y="152" font-family="'Poppins',sans-serif" font-size="16" font-weight="500"
        letter-spacing="7" fill="#6b2c94">DIGITAL&#160;·&#160;SEO&#160;·&#160;MARKETING</text>
</svg>
