<!doctype html><html lang="fr"><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap');
  *{margin:0;box-sizing:border-box}
  body{font-family:'Poppins',sans-serif;background:#07040f;width:1200px}
  .sheet{padding:56px 60px}
  h1{color:#fff;font-size:30px} .sub{color:#9c6fdd;font-size:14px;letter-spacing:3px;text-transform:uppercase;margin:6px 0 40px}
  .block{margin-bottom:30px}
  .lbl{color:#4ce7f3;font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-bottom:12px}
  .card{border-radius:20px;padding:34px 42px;display:flex;align-items:center;gap:40px;border:1px solid #241a3d}
  .dark{background:linear-gradient(135deg,#0e0a1a,#1a1330)}
  .light{background:#f4f2fb}
  .card img{height:92px}
  .mono-dark img{filter:brightness(0) invert(1)}
  .icons{display:flex;gap:20px;align-items:center}
  .icons .i16{width:16px;height:16px}.icons .i32{width:32px;height:32px}.icons .i64{width:64px;height:64px}.icons .i128{width:110px;height:110px}
  .icons figure{display:flex;flex-direction:column;align-items:center;gap:8px}
  .icons figcaption{color:#6b7280;font-size:11px}
  .swatches{display:flex;gap:14px;flex-wrap:wrap}
  .sw{width:120px;border-radius:12px;overflow:hidden;border:1px solid #241a3d}
  .sw .c{height:60px}.sw .t{color:#cbb8ee;font-size:11px;padding:6px 8px;background:#120a20;font-family:monospace}
</style></head><body><div class="sheet">
  <h1>My DTM Paris — Logo</h1>
  <div class="sub">Badge signal + wordmark curseur · dégradé néon · 3 variantes</div>

  <div class="block"><div class="lbl">Version principale — fond clair</div>
    <div class="card light"><img src="logo-primary-light.svg"></div></div>

  <div class="block"><div class="lbl">Monochrome adaptatif — 1 couleur (rendu sur sombre / clair)</div>
    <div class="card mono-dark dark"><img src="logo-mono.svg"></div>
    <div style="height:16px"></div>
    <div class="card light"><img src="logo-mono.svg"></div></div>

  <div class="block"><div class="lbl">Symbole seul — favicon / avatar / app icon</div>
    <div class="card dark icons">
      <figure><img class="i16" src="logo-symbol.svg"><figcaption>16px</figcaption></figure>
      <figure><img class="i32" src="logo-symbol.svg"><figcaption>32px</figcaption></figure>
      <figure><img class="i64" src="logo-symbol.svg"><figcaption>64px</figcaption></figure>
      <figure><img class="i128" src="logo-symbol.svg"><figcaption>512px</figcaption></figure>
    </div></div>

  <div class="block"><div class="lbl">Palette</div>
    <div class="swatches">
      <div class="sw"><div class="c" style="background:#0e0a1a"></div><div class="t">#0E0A1A encre</div></div>
      <div class="sw"><div class="c" style="background:#29f5eb"></div><div class="t">#29F5EB cyan</div></div>
      <div class="sw"><div class="c" style="background:#4d71ee"></div><div class="t">#4D71EE bleu</div></div>
      <div class="sw"><div class="c" style="background:#e511e6"></div><div class="t">#E511E6 magenta</div></div>
      <div class="sw"><div class="c" style="background:#9c6fdd"></div><div class="t">#9C6FDD lilas</div></div>
    </div></div>
</div></body></html>
